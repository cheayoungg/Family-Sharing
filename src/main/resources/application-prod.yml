spring:
  datasource:
    url: ${DB_URL} # 예) jdbc:postgresql://db.example.com:5432/homeproject
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  # 시작할 때 db/migration의 마이그레이션을 적용한 뒤, 그 결과를 ddl-auto=validate가 엔티티와 대조한다
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

# nginx가 넘기는 X-Forwarded-For/Proto/Host를 읽어 원래 클라이언트 IP·https 여부로 처리한다.
# Tomcat은 사설 IP 대역(Docker 네트워크 포함)에서 온 요청의 헤더만 믿으므로, 외부에서 직접 위조한 헤더는 무시된다
server:
  forward-headers-strategy: native

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000 # 24h

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS} # 쉼표로 구분, 예) https://family.example.com

# 운영에서는 API 구조를 외부에 공개하지 않도록 Swagger UI와 스펙을 끈다
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
