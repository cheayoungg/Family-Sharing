spring:
  datasource:
    url: ${DB_URL} # 예) jdbc:postgresql://db.example.com:5432/homeproject
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000 # 24h

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS} # 쉼표로 구분, 예) https://family.example.com

# 운영에서는 API 구조를 외부에 공개하지 않도록 Swagger UI와 스펙을 끈다
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
