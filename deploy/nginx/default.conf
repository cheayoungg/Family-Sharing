# 80 → app:8080 리버스 프록시

server {
    listen 80;
    server_name _;

    # Docker 내장 DNS. app 컨테이너가 새 이미지로 다시 만들어지면 IP가 바뀌므로,
    # 시작할 때 한 번만 찾지 않고 요청 때마다(10초 캐시) 다시 찾는다
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $app_upstream http://app:8080;

    client_max_body_size 10m;

    # 앱이 원래 요청(클라이언트 IP, https 여부, 호스트)을 알 수 있게 넘긴다.
    # location에서 proxy_set_header를 따로 쓰면 이 설정이 상속되지 않으므로 location에는 쓰지 않는다
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    # nginx가 맨 앞단이므로 클라이언트가 보낸 X-Forwarded-For는 버리고 실제 접속 IP로 덮어쓴다.
    # 앞에 로드밸런서(ALB 등)를 두게 되면 $proxy_add_x_forwarded_for로 바꿔 그 값을 이어 받는다
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;

    # 헬스체크만 공개하고 나머지 actuator 경로는 앱까지 보내지 않는다 (앱도 health만 노출하지만 한 겹 더 막는다)
    location = /actuator/health {
        proxy_pass $app_upstream;
    }

    location /actuator/ {
        return 404;
    }

    location / {
        proxy_pass $app_upstream;
    }
}
