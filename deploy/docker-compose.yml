# ------------------------------------------------------------------
# 운영 서버용 compose 파일: nginx(외부 진입점) → app → db
#
# 사용법 (이 폴더에서):
#   cp .env.example .env   # 값을 채운다
#   docker compose pull && docker compose up -d
#
# 외부에는 nginx의 포트만 열린다. app, db는 ports가 없어 Docker 네트워크 안에서만 통신한다.
#   edge    : nginx ↔ app
#   backend : app ↔ db (internal: 외부 인터넷과도 단절)
# ------------------------------------------------------------------

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      # HTTPS는 인증서를 준비한 뒤 default.conf에 443 server 블록을 추가하고 이 줄의 주석을 푼다
      # - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - edge
    logging: *default-logging

  app:
    image: ${IMAGE_REGISTRY:?IMAGE_REGISTRY를 .env에 설정하세요}/family-app:${IMAGE_TAG:?IMAGE_TAG를 .env에 설정하세요}
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:?DB_NAME을 .env에 설정하세요}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME을 .env에 설정하세요}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD를 .env에 설정하세요}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET을 .env에 설정하세요}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS를 .env에 설정하세요}
      # Flyway 도입 전에 만든 DB를 이어 쓸 때만 한 번 true로 (README 배포 4단계의 baseline 참고)
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: ${FLYWAY_BASELINE_ON_MIGRATE:-false}
      # heap 상한 = 메모리 제한의 이 비율 (README 배포 5단계 참고)
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=${APP_HEAP_PERCENT:-50}
    # 제한이 없으면 JVM이 서버 전체 메모리를 기준으로 heap을 잡는다
    mem_limit: ${APP_MEM_LIMIT:-768m}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      # JVM 기동 + Flyway 마이그레이션 시간. 이 동안의 실패는 retries에 세지 않는다
      start_period: 60s
    depends_on:
      db:
        condition: service_healthy
    networks:
      - edge
      - backend
    logging: *default-logging

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    # 볼륨이 비어 있을 때(처음 한 번)만 이 계정·DB를 만든다. 이후 값을 바꿔도 반영되지 않는다
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME을 .env에 설정하세요}
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME을 .env에 설정하세요}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD를 .env에 설정하세요}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend
    logging: *default-logging

networks:
  edge:
  backend:
    internal: true

volumes:
  pgdata:
