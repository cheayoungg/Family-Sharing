# ------------------------------------------------------------------
# 운영 서버용 compose 파일: nginx(외부 진입점, TLS) → app → db, certbot(인증서 발급·갱신)
#
# 사용법 (이 폴더에서):
#   cp .env.example .env   # 값을 채운다
#   docker compose pull && docker compose up -d
#   인증서 최초 발급과 갱신은 HTTPS.md 참고
#
# 외부에는 nginx의 80/443만 열린다. app, db는 ports가 없어 Docker 네트워크 안에서만 통신한다.
#   edge    : nginx ↔ app
#   backend : app ↔ db (internal: 외부 인터넷과도 단절)
#   acme    : certbot 전용 (Let's Encrypt와 통신만 하고 다른 서비스는 보지 않는다)
# nginx와 certbot은 네트워크가 아니라 볼륨(certbot-etc: 인증서, certbot-www: 챌린지 파일)을 공유한다
# ------------------------------------------------------------------

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"   # ACME 챌린지 + https 리다이렉트
      - "443:443" # TLS → app
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN을 .env에 설정하세요}
      # templates/의 ${DOMAIN}만 치환한다 ($host 같은 nginx 변수는 그대로 둔다)
      NGINX_ENVSUBST_FILTER: ^DOMAIN$$
      # 갱신된 인증서를 반영하려고 설정을 다시 읽는 주기
      NGINX_RELOAD_INTERVAL: 6h
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/entrypoint/40-https-if-cert.sh:/docker-entrypoint.d/40-https-if-cert.sh:ro
      - ./nginx/entrypoint/41-reload-loop.sh:/docker-entrypoint.d/41-reload-loop.sh:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - edge
    logging: *default-logging

  app:
    image: ${IMAGE_REGISTRY:?IMAGE_REGISTRY를 .env에 설정하세요}/family-app:${IMAGE_TAG:?IMAGE_TAG를 .env에 설정하세요}
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:?DB_NAME을 .env에 설정하세요}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME을 .env에 설정하세요}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD를 .env에 설정하세요}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET을 .env에 설정하세요}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS를 .env에 설정하세요}
      # Flyway 도입 전에 만든 DB를 이어 쓸 때만 한 번 true로 (README 배포 4단계의 baseline 참고)
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: ${FLYWAY_BASELINE_ON_MIGRATE:-false}
      # heap 상한 = 메모리 제한의 이 비율 (README 배포 5단계 참고)
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=${APP_HEAP_PERCENT:-50}
    # 제한이 없으면 JVM이 서버 전체 메모리를 기준으로 heap을 잡는다
    mem_limit: ${APP_MEM_LIMIT:-768m}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      # JVM 기동 + Flyway 마이그레이션 시간. 이 동안의 실패는 retries에 세지 않는다
      start_period: 60s
    depends_on:
      db:
        condition: service_healthy
    networks:
      - edge
      - backend
    logging: *default-logging

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    # 볼륨이 비어 있을 때(처음 한 번)만 이 계정·DB를 만든다. 이후 값을 바꿔도 반영되지 않는다
    environment:
      # 컨테이너 OS 시간대(쉘에서 date 등). PostgreSQL 자체의 timezone 설정은 UTC 그대로다.
      # 앱은 시각을 시간대 없는 timestamp에 한국 시각으로 직접 넣으므로(Clock) DB timezone의 영향을 받지 않는다
      TZ: Asia/Seoul
      POSTGRES_DB: ${DB_NAME:?DB_NAME을 .env에 설정하세요}
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME을 .env에 설정하세요}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD를 .env에 설정하세요}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend
    logging: *default-logging

  # 12시간마다 갱신을 시도한다. 만료 30일 이내인 인증서만 실제로 갱신되고, nginx는 6시간마다 다시 읽어 반영한다.
  # 최초 발급은 이 서비스로 한 번 직접 실행한다 (HTTPS.md 2단계)
  certbot:
    image: certbot/certbot:v5.8.0
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN을 .env에 설정하세요}
      CERTBOT_EMAIL: ${CERTBOT_EMAIL:?CERTBOT_EMAIL을 .env에 설정하세요}
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"]
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    networks:
      - acme
    logging: *default-logging

networks:
  edge:
  backend:
    internal: true
  acme:

volumes:
  pgdata:
  certbot-etc:
  certbot-www:
