# ------------------------------------------------------------------
# 앱 + PostgreSQL을 한 번에 띄우는 로컬 확인용 compose 파일
#
# 사용법: .env.example을 .env로 복사해 값을 채운 뒤
#   docker compose up -d --build
#
# DB_URL은 아래에서 compose 안의 db 컨테이너로 덮어쓰므로 .env 값은 무시된다.
# DB_USERNAME/DB_PASSWORD는 DB 컨테이너를 처음 만들 때 계정으로도 쓰인다.
# (볼륨이 이미 있으면 계정이 바뀌지 않는다. 바꾸려면 docker compose down -v)
# ------------------------------------------------------------------

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: homeproject
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    env_file: .env
    environment:
      # 새 DB에는 테이블이 없어 prod(ddl-auto=validate)로는 시작하지 못하므로, 지정하지 않으면 dev로 띄운다
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_URL: jdbc:postgresql://db:5432/homeproject
    ports:
      # ./gradlew bootRun이 8080을 쓰고 있으면 APP_PORT=18080처럼 바꿔 띄운다
      - "${APP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
